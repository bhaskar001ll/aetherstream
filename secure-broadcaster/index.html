<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AetherStream by Bhaskar — Secure Send</title>
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" href="../muffin_logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../core/style.css" />
  </head>
  <body class="app-shell">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">AETHERSTREAM</p>
        <h1>Broadcast Transmission</h1>
        <p class="subtitle">Encode and broadcast live QR chunks over screen light.</p>
      </div>
      <div class="hero-badge" onclick="window.location.href='../'" style="cursor: pointer;">HOME</div>
    </header>

    <main class="card">
      <div class="view-header">
        <div>
          <h2 id="tool-title">SECURE SEND MODE</h2>
          <p class="small-label">Screen to camera. No network in between.</p>
        </div>
      </div>



      <div class="mode-grid mode-picker" id="mode-picker" aria-label="What to send">
        <button type="button" class="mode-card secondary" id="mode-btn-file" style="text-align: center; color: white; font-weight: bold; width: 100%;">
          File
        </button>
        <button type="button" class="mode-card secondary" id="mode-btn-snippet" style="text-align: center; color: white; font-weight: bold; width: 100%;">
          Text snippet
        </button>
      </div>

      <div class="field-row note-composer" id="pane-snippet">
        <label for="snippet-text" class="field-label" id="snippet-label">Text to send</label>
        <textarea id="snippet-text" rows="7" placeholder="Paste or type anything..."></textarea>
      </div>

      <div class="field-row" id="pane-file">
        <label class="field-label" id="file-picker-label" for="cfg-file">Any file · up to %MAX_FILE_LABEL%</label>
        <input id="cfg-file" type="file" />
      </div>

      <div class="field-row" id="secure-panel">
        <label for="secure-password" class="field-label" style="color: #10b981;">Encryption Password</label>
        <input type="password" id="secure-password" placeholder="Enter password to encrypt..." style="border: 1px solid #10b981; color: white;" />
      </div>

      <div class="actions" style="margin-top: 1rem; display: flex; justify-content: center;">
        <button id="start-btn" class="primary" type="button" disabled style="font-size: 1.1rem; padding: 0.75rem 2rem;">Start Broadcast</button>
      </div>

      <div class="qr-panel stream-panel stage" id="stage" hidden>
        <canvas id="qr" width="16" height="16" role="img" aria-label="Live QR broadcast"></canvas>
      </div>

      <div class="session-box settings">
        <span class="label">Transfer settings</span>
        <div class="button-row">
          <label class="field-label">Layout
            <select id="cfg-grid" class="fps-select">
              <option value="2x2" selected>4× Grid (2×2)</option>
              <option value="1x1">1× Single QR</option>
            </select>
          </label>
          <label class="field-label">FPS
            <select id="cfg-fps" class="fps-select">%TX_FPS_OPTIONS%</select>
          </label>
          <label class="field-label">Bytes/Frame
            <select id="cfg-bytes" class="fps-select">%FRAME_BYTES_OPTIONS%</select>
          </label>
          <label class="field-label">ECC
            <select id="cfg-ecc" class="fps-select">
              <option selected>L</option><option>M</option><option>Q</option><option>H</option>
            </select>
          </label>
          <label class="field-label">Size
            <input id="cfg-size" type="range" min="300" max="1200" step="50" value="900" />
          </label>
        </div>
      </div>

      <p style="margin-top:20px; color:#94a3b8; font-size: 0.85rem; text-align:center;">
        Designed & Authored by Bhaskar.
      </p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
